<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple Interest Rate Calculator to calculate interest based on principal, rate and time">
  <title>Interest Rate Calculator</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Interest Rate Calculator</h1>
  
  <div class="container">
    <label for="principal">Principal Amount: </label>
    <input type="number" id="principal" placeholder="Enter Principal">
    
    <label for="rate">Rate of Interest %: </label>
    <input type="number" id="rate" placeholder="Enter Rate">
    
    <label for="time">Time in Years: </label>
    <input type="number" id="time" placeholder="Enter Time">
    
    <button onclick="calculateInterest()">Calculate</button>
    
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
